# Refreshes the journal from Notion and deploys the site to GitHub Pages.
# Runs on every push to main, on a daily schedule, and on manual trigger.
#
# Setup (one time):
#   1. Repo Settings -> Secrets and variables -> Actions -> New repository secret
#      Name: NOTION_TOKEN   Value: your Notion integration token
#   2. Repo Settings -> Pages -> Source: "GitHub Actions"
#
# Note: this workflow assumes the site lives at the repo root.

name: Sync Notion & Deploy

on:
  push:
    branches: [main]
  schedule:
    - cron: "0 12 * * *" # daily at 12:00 UTC
  workflow_dispatch: {}

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build-deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22

      - name: Sync journal from Notion
        env:
          NOTION_TOKEN: ${{ secrets.NOTION_TOKEN }}
        run: node scripts/sync-notion.js

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: "." # <- the folder to publish

      - id: deploy
        uses: actions/deploy-pages@v4
